# Quake Terminal Configuration

window_class = "wezquake"
start_command = "wezterm start --class wezquake"
hotkey = "Meta+Grave"

# Display settings:
# display_mode: "follow-mouse", "specific", or "active"
display_mode = "follow-mouse"
display_index = 0           # Only used if display_mode = "specific"

width_percent = 40        # Width as percentage of screen width
height_percent = 40         # Height as percentage of screen height

show_duration = 300
hide_duration = 300
show_easing = "ease-out-cubic"
hide_easing = "ease-in-quart"
