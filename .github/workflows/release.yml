name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-linux:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl
          components: rust-src

      - name: Install musl-tools
        run: sudo apt-get install -y musl-tools

      - name: Build Linux binary
        run: |
          RUSTFLAGS="-Zunstable-options -Cpanic=immediate-abort" \
            cargo +nightly -Zbuild-std=std,panic_abort build --release --target x86_64-unknown-linux-musl

      - uses: actions/upload-artifact@v7
        with:
          name: janq-linux
          path: target/x86_64-unknown-linux-musl/release/janq

  build-windows:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin and llvm
        run: |
          sudo apt-get install -y llvm
          cargo install cargo-xwin

      - name: Build Windows binary
        run: |
          RUSTFLAGS="-C opt-level=z" \
            cargo xwin build --release --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v7
        with:
          name: janq-windows
          path: target/x86_64-pc-windows-msvc/release/janq.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: janq-linux
          path: artifacts/linux

      - uses: actions/download-artifact@v7
        with:
          name: janq-windows
          path: artifacts/windows

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d')
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest Linux binary
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/linux/janq

      - name: Attest Windows binary
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/windows/janq.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "${{ steps.changelog.outputs.body }}" \
            artifacts/linux/janq \
            artifacts/windows/janq.exe \
            examples/janq.single.example.toml \
            examples/janq.multi.example.toml
