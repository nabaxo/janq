# janq Multi-App Configuration Example
# Place this file at ~/.janq.toml or ~/.config/janq/janq.toml

# You can define multiple applications by naming sections like [app.NAME]
# You can toggle specific ones via `janq --app NAME` or using their unique hotkeys.

# Any key with a default value can be omitted if you want to use the default.

[app.terminal]
window_class = "wezquake"
start_command = "wezterm start --class wezquake"
hotkey = ["Meta+Grave", "Ctrl+Grave"] # Multiple hotkeys supported!
animate_opacity = true

[app.zed]
window_class = "zed"
start_command = "zed"
hotkey = "Meta+Z"
animate_opacity = true
# App-specific overrides (width/height = "0" or "unset" means skip resizing for this app)
width = "1200px"
height = "800px"

[app.kcalc]
window_class = "kcalc"
start_command = "kcalc"
hotkey = "Meta+F2"
animate_opacity = false
# Setting dimensions to "0" or "unset" exempts the app from any generally set height/width.
width = "0"
height = "0"

# --- Global Window Settings ---
[window]
# Monitor selection mode: "follow-mouse", "active", "specific" (Default: "follow-mouse")
display_mode = "active"

# Show window automatically on daemon startup. (Default: false)
auto_show = false

# Global default dimensions for apps that don't override them. (Default: unset/null)
# Can be omitted to leave dimensions managed by the application.
width = "80%"
height = "50%"

# Stay on top of other windows. (Default: false)
keep_above = true

# (Linux only) Use KWin Fullscreen state to sit on top of other fullscreen apps. (Default: false)
force_priority = false

# Hide window from task managers, pagers, and the task switcher (Linux). (Default: false)
skip_pager = false

# (Linux only) Window follows you across virtual desktops. (Default: true)
all_desktops = true

# Remove window borders/chrome. (Default: false)
no_borders = false

# Direction to slide in: "top", "bottom", "left", "right" (Default: "top")
slide_from = "top"

# Position along the edge: "center", "50%", "-10%", "100px", "-50px" (Default: "center")
offset = "center"

# --- Animation Settings ---
[animation]
# Durations and easing curves.
# Easing options: "linear", "ease", "ease-in", "ease-out", "ease-in-out", "sine", "sine-in", "sine-out",
#                 "cubic", "cubic-in", "cubic-out", "quart", "quart-in", "quart-out", "back", "back-in",
#                 "back-out", "expo", "expo-in", "expo-out", "impulse", or "cubic-bezier(x1,y1,x2,y2)"
# (Defaults: 350 and "ease")
show_duration = 400
hide_duration = 300
show_easing = "cubic-out"
hide_easing = "expo-in"

# Global opacity settings. (Default: false)
animate_opacity = true

# Opacity points (0.0 - 1.0). (Defaults: 0.2 and 0.8)
# show_opacity_point: point by which the window becomes fully opaque
# hide_opacity_point: point when fade-out starts
# Can be omitted to use the defaults.
show_opacity_point = 0.2
hide_opacity_point = 0.8

# Animation framerate (0-1000 or "auto"). (Default: "auto")
# "auto" uses the monitor's refresh rate (recommended).
# 0 disables animations entirely (instant transition).
# Use a specific number like 60 or 120 to cap the FPS. (Default: "auto")
framerate = "auto"
