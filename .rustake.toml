# Quake Terminal Configuration

window_class = "wezquake"
start_command = "wezterm start --class wezquake"
hotkey = "Meta+Grave"
keep_above = false

# Display settings:
# display_mode: "follow-mouse", "specific", or "active"
display_mode = "follow-mouse"
display_index = 0           # Only used if display_mode = "specific"

width_percent = 40        # Width as percentage of screen width
height_percent = 40         # Height as percentage of screen height

# Optional: Set dimensions as terminal rows and columns instead of percentage.
# If these are non-zero, they take precedence over percentages.
# (Goake will automatically pass these to WezTerm via --config initial_cols/rows)
width_cols = 120
height_rows = 40

show_duration = 350
hide_duration = 350
# Easing functions:
# linear, ease-in, ease-out, ease-in-out
# sine-in, sine-out, sine-in-out (or ease-in-sine, etc.)
# quart-in, quart-out, quart-in-out
# cubic-in, cubic-out, cubic-in-out
# back-in, back-out, back-in-out, windows
show_easing = "windows"
hide_easing = "windows"

# Opacity animation settings
# Set to false to disable fade in/out effect entirely
animate_opacity = true
# show_opacity_point: When fade-in completes (0.0-1.0)
#   Lower values = faster fade-in (e.g., 0.3 = full opacity at 30% of animation)
show_opacity_point = 0.2
# hide_opacity_point: When fade-out starts (0.0-1.0)
#   Higher values = later fade-out (e.g., 0.7 = start fading at 70% of animation)
hide_opacity_point = 0.8
