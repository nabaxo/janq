[package]
name = "rustake"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
zbus = { version = "4.4", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tokio = { version = "1.39", features = ["full"] }
thiserror = "1.0"
notify = "6.1"
image = "0.25"
