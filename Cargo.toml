[package]
name = "janq"
version = "1.0.5"
edition = "2021"
rust-version = "1.88"
resolver = "2"
description = "Quake-style dropdown terminal manager for Linux (KDE) and Windows"


[dependencies]
# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
toml = { version = "1.0", default-features = false, features = ["std", "serde", "parse", "preserve_order"] }

# Performance & Collections
indexmap = { version = "2.13.0", features = ["serde"] }
rustc-hash = "2.1.1"

# Async Runtime (base features for both platforms)
tokio = { version = "1.49.0", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
    "signal",
] }

# File Handling & Monitoring
fs4 = "0.13.1"

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.49.0", features = ["process"] }

[target.'cfg(windows)'.dependencies]
notify = { version = "9.0.0-rc.4", default-features = false }
# Windows needs multi-threaded runtime and named pipe support
tokio = { version = "1.49.0", features = ["rt-multi-thread", "net", "io-util"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Multimedia",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
], default-features = false }
tray-icon = "0.24"
global-hotkey = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = 'abort'
strip = true
overflow-checks = false
