[package]
name = "janq"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
resolver = "2"
description = "Quake-style dropdown terminal manager for Linux (KDE) and Windows"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.9", features = ["preserve_order"] }

# Performance & Collections
indexmap = { version = "2.13.0", features = ["serde"] }
rustc-hash = "2.1.1"

# Async Runtime (base features for both platforms)
tokio = { version = "1.49.0", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
    "signal",
    "process",
] }

# File Handling & Monitoring
fs4 = "0.13.1"
notify = { version = "8.2", default-features = false }

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.0", default-features = false, features = ["tokio"] }
ksni = { version = "0.3.3", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
# Windows needs multi-threaded runtime and named pipe support
tokio = { version = "1.49.0", features = ["rt-multi-thread", "net", "io-util"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
], default-features = false }
tray-icon = "0.21"
global-hotkey = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = 'abort'
strip = true
overflow-checks = false
